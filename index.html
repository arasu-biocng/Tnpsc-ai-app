<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNPSC AI Test Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #1e293b;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta Malar', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(10px); border-radius: 16px; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 24px; color: var(--accent-color); }
        .streak-badge { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: var(--warning); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }

        .info-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; backdrop-filter: blur(10px); }
        .info-card h3 { font-size: 15px; color: var(--accent-color); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--card-border); padding-bottom: 6px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
        .form-control { width: 100%; padding: 11px 14px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; color: var(--text-primary); font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--accent-color); box-shadow: 0 0 8px var(--accent-glow); }

        .btn-primary { background: linear-gradient(90deg, #0284c7 0%, #38bdf8 100%); color: #ffffff; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 700; width: 100%; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 20px var(--accent-glow); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-box { background: #1e293b; border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; max-width: 400px; width: 100%; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <div class="title-text"><h1>TNPSC AI தேர்வு</h1></div>
            </div>
            <div class="streak-badge"><i class="fa-solid fa-fire"></i> 0 Days Streak</div>
        </header>

        <!-- API Key Input -->
        <div class="info-card">
            <h3><i class="fa-solid fa-key"></i> API சாவி (API Key)</h3>
            <div class="form-group">
                <label>Gemini API Key உள்ளிடவும்:</label>
                <input type="password" id="apiKeyInput" class="form-control" placeholder="AIZA..." />
            </div>
        </div>

        <!-- TNPSC Full Syllabus Selection -->
        <div class="info-card">
            <h3><i class="fa-solid fa-book-bookmark"></i> பாடத்திட்டம் (Syllabus Selection)</h3>
            
            <!-- Exam Category -->
            <div class="form-group">
                <label>1. தேர்வு வகை (Exam Level):</label>
                <select id="examSelect" class="form-control">
                    <option value="Group 4 / VAO">TNPSC Group 4 / VAO</option>
                    <option value="Group 2 / 2A">TNPSC Group 2 / 2A</option>
                    <option value="Group 1">TNPSC Group 1</option>
                </select>
            </div>

            <!-- Unit / Subject -->
            <div class="form-group">
                <label>2. பாடம் / யூனிட் (Subject / Unit):</label>
                <select id="subjectSelect" class="form-control" onchange="updateTopics()">
                    <option value="General Tamil">பொதுத் தமிழ் (General Tamil)</option>
                    <option value="Unit 8">Unit 8: தமிழ்நாட்டின் வரலாறு, பண்பாடு & சமூக இயக்கங்கள்</option>
                    <option value="Unit 9">Unit 9: தமிழகத்தில் வளர்ச்சி நிர்வாகம் (Development Admin)</option>
                    <option value="History">இந்திய வரலாறு & பண்பாடு (History & Culture)</option>
                    <option value="Polity">இந்திய ஆட்சியியல் (Indian Polity)</option>
                    <option value="Geography">இந்திய புவியியல் (Geography)</option>
                    <option value="Economy">இந்திய பொருளாதாரம் (Economy)</option>
                    <option value="INM">இந்திய தேசிய இயக்கம் (INM)</option>
                    <option value="Science">பொது அறிவியல் (General Science)</option>
                    <option value="Aptitude">திறனறிவும் மனக்கணக்கு நுண்ணறிவும் (Aptitude)</option>
                </select>
            </div>

            <!-- Topic Selection -->
            <div class="form-group">
                <label>3. தலைப்பு (Sub-Topic):</label>
                <select id="topicSelect" class="form-control">
                    <!-- Topics will populate dynamically -->
                </select>
            </div>

            <!-- Custom Topic -->
            <div class="form-group">
                <label>4. சொந்தத் தலைப்பு (விருப்பப்பட்டால் Type செய்யவும்):</label>
                <input type="text" id="customTopic" class="form-control" placeholder="மேலே உள்ள பட்டியல் தவிர வேறு தலைப்பு வேண்டுமெனில் தட்டச்சு செய்யவும்..." />
            </div>

            <!-- Question Count -->
            <div class="form-group">
                <label>5. வினாக்கள் எண்ணிக்கை:</label>
                <select id="questionCount" class="form-control">
                    <option value="5">5 வினாக்கள் (Quick Test)</option>
                    <option value="10" selected>10 வினாக்கள் (Standard)</option>
                    <option value="20">20 வினாக்கள் (Deep Level Test)</option>
                </select>
            </div>
        </div>

        <!-- Start Button -->
        <button class="btn-primary" onclick="generateQuestions()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> AI தேர்வை உருவாக்கு
        </button>
    </div>

    <!-- Modal Popup -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 id="modalTitle" style="color: var(--accent-color); margin-bottom:10px;">அறிவிப்பு</h3>
            <p id="modalDesc" style="color: var(--text-secondary); margin-bottom:18px; font-size:14px;">செய்தி...</p>
            <button class="btn-primary" onclick="closeModal()">சரி</button>
        </div>
    </div>

    <script>
        // TNPSC பாடத்திட்டத்திற்கான தலைப்புகள் (Dynamic Topics Database)
        const syllabusData = {
            "General Tamil": [
                "இலக்கணம் - பொருத்துதல், புகழ் பெற்ற நூல் நூலாசிரியர்",
                "இலக்கணம் - பிரித்தெழுதுக, சேர்த்தெழுதுக",
                "இலக்கியம் - திருக்குறள், எட்டுத்தொகை, பத்துப்பாட்டு",
                "இலக்கியம் - ஐம்பெருங்காப்பியங்கள், ஐஞ்சிறுங்காப்பியங்கள்",
                "தமிழ் அறிஞர்களும் தமிழ்த்தொண்டும்"
            ],
            "Unit 8": [
                "சங்க காலம் முதல் இக்காலம் வரையிலான தமிழ் இலக்கியம்",
                "திருக்குறள் (அறத்துப்பால், பொருட்பால், இன்பத்துப்பால்)",
                "விடுதலைப் போராட்டத்தில் தமிழ்நாட்டின் பங்கு",
                "19 மற்றும் 20-ஆம் நூற்றாண்டின் சமூக-அரசியல் இயக்கங்கள்",
                "சேர, சோழ, பாண்டியர் வரலாறு & தொல்லியல் கண்டுபிடிப்புகள்"
            ],
            "Unit 9": [
                "தமிழ்நாட்டின் மனிதவள மேம்பாட்டுக் குறியீடுகள் (HDI)",
                "தமிழக அரசின் நலத்திட்டங்கள் & சமூக நீதி",
                "தமிழ்நாட்டின் பொருளாதாரப் போக்குகள் & மின்-ஆளுமை (e-Governance)",
                "தமிழகத்தின் கல்வி மற்றும் சுகாதார முறைகள்"
            ],
            "History": [
                "சிந்துவெளி நாகரிகம் (Indus Valley)",
                "குப்தர்கள், டெல்லி சுல்தான்கள், முகலாயர்கள்",
                "விஜயநகர மற்றும் பாமினி அரசுகள்",
                "மராத்தியர்கள் & தென்னிந்திய வரலாறு"
            ],
            "Polity": [
                "இந்திய அரசியலமைப்பு - முகப்புரை & சிறப்பியல்புகள்",
                "அடிப்படை உரிமைகள் & அடிப்படை கடமைகள்",
                "மத்திய அரசு, மாநில அரசு & உள்ளாட்சி அமைப்புகள் (பஞ்சாயத்து ராஜ்)",
                "கூட்டாட்சியின் அடிப்படைத் தன்மைகள் & தேர்தல் ஆணையம்"
            ],
            "Geography": [
                "அமைவிடம் - இயற்கை அமைவுகள் & பருவமழை",
                "நீர் வளங்கள், ஆறுகள் & மண் வகைகள்",
                "காடுகள் & வன உயிரினங்கள்",
                "போக்குவரத்து & தகவல் தொடர்பு"
            ],
            "Economy": [
                "இந்திய பொருளாதாரத்தின் இயல்புகள் & ஐந்தாண்டுத் திட்டங்கள்",
                "நிதி ஆயோக் (NITI Aayog) & ரிசர்வ் வங்கி (RBI)",
                "ஜிஎஸ்டி (GST) & வரி அமைப்பு",
                "வேளாண்மை & ஊரக வளர்ச்சி திட்டங்கள்"
            ],
            "INM": [
                "தேசிய மறுமலர்ச்சி & தொடக்ககால எழுச்சிகள்",
                "இந்திய தேசிய காங்கிரஸ் (INC) & தலைவர்கள்",
                "காந்திய காலகட்டம் & பகத் சிங், நேதாஜி பங்கு",
                "தமிழ்நாட்டின் விடுதலைப் போராட்ட தலைவர்கள் (பாரதியார், வ.உ.சி, ராஜாஜி)"
            ],
            "Science": [
                "இயற்பியல் - அளவீடுகள், விசை, இயக்கம், மின்சாரவியல்",
                "வேதியியல் - அமிலங்கள், காரங்களும, உப்புக்கள், தனிமங்கள்",
                "உயிரியல் - மனித உடலியங்கியல், நோய்கள் & ஊட்டச்சத்து",
                "சுற்றுச்சூழல் & சூழலியல்"
            ],
            "Aptitude": [
                "மீ.பொ.வ (HCF) மற்றும் மீ.சி.ம (LCM)",
                "விகிதம் மற்றும் சமவிகிதம் (Ratio & Proportion)",
                "தனிவட்டி மற்றும் கூட்டுவட்டி (Simple & Compound Interest)",
                "பரப்பளவு மற்றும் சுற்றளவு (Area & Volume)",
                "எழுத்து மற்றும் எண் காரணவியல் (Reasoning)"
            ]
        };

        // பாடம் மாறும்போது தலைப்புகளைப் புதுப்பிக்கும் Function
        function updateTopics() {
            const subjectSelect = document.getElementById('subjectSelect').value;
            const topicSelect = document.getElementById('topicSelect');
            topicSelect.innerHTML = '';

            const topics = syllabusData[subjectSelect] || [];
            topics.forEach(topic => {
                const option = document.createElement('option');
                option.value = topic;
                option.textContent = topic;
                topicSelect.appendChild(option);
            });
        }

        // முதன்முறை பக்கத்தை லோட் செய்யும் போது தலைப்புகளை அமைக்க
        window.onload = function() {
            updateTopics();
        };

        // AI வினாக்கள் உருவாக்கும் Function
        async function generateQuestions() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const exam = document.getElementById('examSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const selectedTopic = document.getElementById('topicSelect').value;
            const customTopic = document.getElementById('customTopic').value.trim();
            const count = document.getElementById('questionCount').value;

            const finalTopic = customTopic !== "" ? customTopic : selectedTopic;

            if (!apiKey) {
                showModal("API Key தேவை", "தயவுசெய்து உங்கள் Gemini API Key-ஐ உள்ளிடவும்.");
                return;
            }

            showModal("ஆய்வு செய்யப்படுகிறது...", `${exam} - ${subject} கீழ் "${finalTopic}" தலைப்பிலிருந்து ${count} வினாக்கள் உருவாக்கம் பெறுகின்றன.`);

            const deepPrompt = `
                நீ ஒரு TNPSC தேர்வு வல்லுநர்.
                தேர்வு: ${exam}
                பாடம்: ${subject}
                தலைப்பு: ${finalTopic}
                
                கண்டிப்பான விதிகள்:
                1. தமிழ்நாடு அரசு 6 முதல் 12-ஆம் வகுப்பு பாடநூல்களின் அடிப்படையில் ${count} ஆழமான (Deep Level) வினாக்களை உருவாக்கவும்.
                2. கூற்று-காரணம் (Statement & Reason) மற்றும் பொருத்துக (Match) வினாக்களைச் சேர்க்கவும்.
                3. ஒவ்வொரு கேள்விக்கும் 4 விருப்பங்கள் (A, B, C, D) மற்றும் ஆழமான விளக்கம் (Detailed Explanation) இருக்க வேண்டும்.
                4. JSON வடிவத்தில் மட்டுமே பதிலளிக்கவும்.
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: deepPrompt }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    showModal("பிழை ஏற்பட்டது", data.error.message);
                } else {
                    showModal("வெற்றி!", "வினாக்கள் வெற்றிகரமாக உருவாக்கப்பட்டுவிட்டன.");
                }
            } catch (err) {
                showModal("பிழை", "API இணைப்பில் சிக்கல் உள்ளது. மீண்டும் முயற்சிக்கவும்.");
            }
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('customModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }
    </script>
</body>
</html>
