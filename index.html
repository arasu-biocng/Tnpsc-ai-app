<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNPSC AI Test Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #1e293b;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta Malar', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(10px); border-radius: 16px; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { font-size: 24px; color: var(--accent-color); }
        .streak-badge { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: var(--warning); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }

        .info-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; backdrop-filter: blur(10px); }
        .info-card h3 { font-size: 15px; color: var(--accent-color); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); padding-bottom: 6px; }

        /* Brain Loading Card (Image 3 Style) */
        .loading-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        .ai-pulse-ring {
            position: relative;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ai-pulse-ring i {
            font-size: 32px;
            color: var(--accent-color);
            z-index: 2;
        }

        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--accent-glow);
            border-radius: 50%;
            animation: pulse-animation 1.8s infinite ease-out;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .loading-text { font-size: 16px; font-weight: 600; color: var(--text-primary); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
        .form-control { width: 100%; padding: 11px 14px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; color: var(--text-primary); font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--accent-color); box-shadow: 0 0 8px var(--accent-glow); }

        .btn-primary { background: linear-gradient(90deg, #0284c7 0%, #38bdf8 100%); color: #ffffff; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 700; width: 100%; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-secondary { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-primary); padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-box { background: #1e293b; border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; max-width: 400px; width: 100%; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <div class="title-text"><h1>TNPSC AI தேர்வு</h1></div>
            </div>
            <div class="streak-badge"><i class="fa-solid fa-fire"></i> 0 Days Streak</div>
        </header>

        <!-- Separate Key Settings Option -->
        <div class="info-card">
            <h3>
                <span><i class="fa-solid fa-key"></i> API சாவி அமைப்புகள்</span>
                <button class="btn-secondary" onclick="toggleKeySettings()">மாற்று</button>
            </h3>
            <div id="keySection" style="display: none; margin-top: 10px;">
                <div class="form-group">
                    <label>Gemini API Key உள்ளிடவும்:</label>
                    <input type="password" id="apiKeyInput" class="form-control" placeholder="AIZA..." />
                </div>
                <button class="btn-secondary" style="width:100%;" onclick="saveApiKey()">சேமி</button>
            </div>
        </div>

        <!-- Brain Loading Section (Image 3 Style) -->
        <div class="loading-card" id="loadingCard">
            <div class="ai-pulse-ring">
                <div class="pulse"></div>
                <i class="fa-solid fa-brain"></i>
            </div>
            <div class="loading-text">AI வினாக்களை உருவாக்கி கொண்டிருக்கிறது...</div>
        </div>

        <!-- TNPSC Syllabus Selection Form -->
        <div class="info-card" id="mainFormCard">
            <h3><span><i class="fa-solid fa-book-bookmark"></i> பாடத்திட்டம் (Syllabus)</span></h3>
            
            <div class="form-group">
                <label>1. தேர்வு வகை:</label>
                <select id="examSelect" class="form-control">
                    <option value="Group 4 / VAO">TNPSC Group 4 / VAO</option>
                    <option value="Group 2 / 2A">TNPSC Group 2 / 2A</option>
                    <option value="Group 1">TNPSC Group 1</option>
                </select>
            </div>

            <div class="form-group">
                <label>2. பாடம் / யூனிட்:</label>
                <select id="subjectSelect" class="form-control" onchange="updateTopics()">
                    <option value="General Tamil">பொதுத் தமிழ் (General Tamil)</option>
                    <option value="Unit 8">Unit 8: தமிழ்நாட்டின் வரலாறு & பண்பாடு</option>
                    <option value="Unit 9">Unit 9: தமிழகத்தில் வளர்ச்சி நிர்வாகம்</option>
                    <option value="History">இந்திய வரலாறு & பண்பாடு</option>
                    <option value="Polity">இந்திய ஆட்சியியல் (Polity)</option>
                    <option value="Aptitude">திறனறிவும் மனக்கணக்கு நுண்ணறிவும்</option>
                </select>
            </div>

            <div class="form-group">
                <label>3. தலைப்பு:</label>
                <select id="topicSelect" class="form-control"></select>
            </div>

            <div class="form-group">
                <label>4. சொந்தத் தலைப்பு (விருப்பப்பட்டால்):</label>
                <input type="text" id="customTopic" class="form-control" placeholder="வேறு தலைப்பு இருந்தால் தட்டச்சு செய்யவும்..." />
            </div>

            <div class="form-group">
                <label>5. வினாக்கள் எண்ணிக்கை:</label>
                <select id="questionCount" class="form-control">
                    <option value="20">20 வினாக்கள்</option>
                    <option value="30" selected>30 வினாக்கள்</option>
                    <option value="40">40 வினாக்கள்</option>
                </select>
            </div>
        </div>

        <button class="btn-primary" id="startBtn" onclick="generateQuestions()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> AI தேர்வை உருவாக்கு
        </button>
    </div>

    <!-- Modal Popup for Errors -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 id="modalTitle" style="color: var(--accent-color); margin-bottom:10px;">அறிவிப்பு</h3>
            <p id="modalDesc" style="color: var(--text-secondary); margin-bottom:18px; font-size:14px;">செய்தி...</p>
            <button class="btn-primary" onclick="closeModal()">சரி</button>
        </div>
    </div>

    <script>
        const syllabusData = {
            "General Tamil": ["இலக்கணம் - பொருத்துதல்", "இலக்கியம் - திருக்குறள்", "தமிழ் அறிஞர்களும் தமிழ்த்தொண்டும்"],
            "Unit 8": ["சங்க கால இலக்கியம்", "விடுதலைப் போராட்டத்தில் தமிழ்நாட்டின் பங்கு", "சேர, சோழ, பாண்டியர் வரலாறு"],
            "Unit 9": ["மனிதவள மேம்பாட்டுக் குறியீடுகள்", "தமிழக அரசின் நலத்திட்டங்கள்"],
            "History": ["சிந்துவெளி நாகரிகம்", "குப்தர்கள் & முகலாயர்கள்"],
            "Polity": ["இந்திய அரசியலமைப்பு", "அடிப்படை உரிமைகள்"],
            "Aptitude": ["மீ.பொ.வ & மீ.சி.ம", "தனிவட்டி & கூட்டுவட்டி"]
        };

        function updateTopics() {
            const subject = document.getElementById('subjectSelect').value;
            const topicSelect = document.getElementById('topicSelect');
            topicSelect.innerHTML = '';
            (syllabusData[subject] || []).forEach(t => {
                const opt = document.createElement('option');
                opt.value = t; opt.textContent = t;
                topicSelect.appendChild(opt);
            });
        }

        function toggleKeySettings() {
            const sec = document.getElementById('keySection');
            sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                alert("API Key சேமிக்கப்பட்டது!");
                toggleKeySettings();
            }
        }

        window.onload = function() {
            updateTopics();
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) document.getElementById('apiKeyInput').value = savedKey;
        };

        async function generateQuestions() {
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                showModal("API Key தேவை", "தயவுசெய்து API Key அமைப்புகளில் சாவி உள்ளிடவும்.");
                return;
            }

            // Hide form and show Brain Loading Card (Image 3)
            document.getElementById('loadingCard').style.display = 'flex';
            document.getElementById('mainFormCard').style.display = 'none';

            const exam = document.getElementById('examSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const topic = document.getElementById('customTopic').value.trim() || document.getElementById('topicSelect').value;
            const count = document.getElementById('questionCount').value;

            const deepPrompt = `TNPSC ${exam} - ${subject} (${topic}) தலைப்பில் ${count} வினாக்களை உருவாக்கவும்.`;

            // Auto Fallback between models to prevent "High Demand" errors (Image 2 Fix)
            const models = ["gemini-1.5-flash", "gemini-1.5-pro"];
            let success = false;

            for (let model of models) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: deepPrompt }] }] })
                    });

                    const data = await response.json();
                    if (!data.error) {
                        success = true;
                        showModal("வெற்றி!", "வினாக்கள் உருவாக்கப்பட்டுவிட்டன.");
                        break;
                    }
                } catch (e) {
                    continue;
                }
            }

            document.getElementById('loadingCard').style.display = 'none';
            document.getElementById('mainFormCard').style.display = 'block';

            if (!success) {
                showModal("பிழை ஏற்பட்டது", "சர்வர் இணைப்பில் அதிக சுமை உள்ளது. சிறிது நேரம் கழித்து முயற்சிக்கவும்.");
            }
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('customModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }
    </script>
</body>
</html>
