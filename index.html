<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNPSC AI Master - Full Syllabus</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .header h1 {
            color: #38bdf8;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 14px;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 15px;
        }

        button.btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button.btn-primary:hover { background: var(--accent-hover); }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #0f172a;
            padding: 12px 15px;
            border-radius: 8px;
        }

        .q-card {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 12px 15px;
            margin-top: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-btn:hover { background: #334155; }
        .option-btn.correct { background: var(--success) !important; color: white; }
        .option-btn.wrong { background: var(--danger) !important; color: white; }

        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background: #1e293b;
            border-left: 4px solid var(--accent);
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
        }

        .ai-ask-box {
            margin-top: 15px;
            padding: 12px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px dashed var(--accent);
        }

        .ai-ask-box textarea {
            height: 60px;
            margin-bottom: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--border);
        }

        .loading-spinner {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1><i class="fa-solid fa-graduation-cap"></i> TNPSC AI Master</h1>
    </div>

    <!-- Navigation Tabs -->
    <div class="tab-buttons">
        <button class="tab-btn active" id="tab1-btn" onclick="switchTab('tab-create')"><i class="fa-solid fa-gear"></i> அமைப்பு</button>
        <button class="tab-btn" id="tab2-btn" onclick="switchTab('tab-quiz')"><i class="fa-solid fa-pen-to-square"></i> தேர்வு</button>
        <button class="tab-btn" id="tab3-btn" onclick="switchTab('tab-result')"><i class="fa-solid fa-chart-line"></i> முடிவு</button>
    </div>

    <!-- TAB 1: Create Test -->
    <div id="tab-create" class="tab-content active">
        <div class="input-group">
            <label><i class="fa-solid fa-key"></i> Gemini API Key</label>
            <input type="password" id="apiKeyInput" placeholder="உங்கள் API சாவியை உள்ளிடவும்...">
        </div>

        <div class="input-group">
            <label>தேர்வு வகை (Exam)</label>
            <select id="examSelect">
                <option value="Group 4 / VAO">TNPSC Group 4 / VAO</option>
                <option value="Group 2 / 2A">TNPSC Group 2 / 2A (Prelims)</option>
                <option value="Group 1">TNPSC Group 1 (Prelims)</option>
            </select>
        </div>

        <div class="input-group">
            <label>பாடம் (Syllabus Subject)</label>
            <select id="subjectSelect">
                <optgroup label="மொழிப் பாடம் (Language)">
                    <option value="பொதுத் தமிழ் - பகுதி அ (இலக்கணம்)">பொதுத் தமிழ் - பகுதி அ (இலக்கணம்)</option>
                    <option value="பொதுத் தமிழ் - பகுதி ஆ (இலக்கியம்)">பொதுத் தமிழ் - பகுதி ஆ (இலக்கியம்)</option>
                    <option value="பொதுத் தமிழ் - பகுதி இ (தமிழ் அறிஞர்களும் தமிழ்த்தொண்டும்)">பொதுத் தமிழ் - பகுதி இ (தமிழ் அறிஞர்களும் தமிழ்த்தொண்டும்)</option>
                    <option value="General English - Part A (Grammar)">General English - Part A (Grammar)</option>
                    <option value="General English - Part B (Poetry & Literature)">General English - Part B (Poetry & Literature)</option>
                </optgroup>
                <optgroup label="பொது அறிவு (General Studies)">
                    <option value="பொது அறிவியல் - இயற்பியல் (Physics)">பொது அறிவியல் - இயற்பியல் (Physics)</option>
                    <option value="பொது அறிவியல் - வேதியியல் (Chemistry)">பொது அறிவியல் - வேதியியல் (Chemistry)</option>
                    <option value="பொது அறிவியல் - தாவரவியல் & விலங்கியல் (Biology)">பொது அறிவியல் - தாவரவியல் & விலங்கியல் (Biology)</option>
                    <option value="நடப்பு நிகழ்வுகள் (Current Affairs)">நடப்பு நிகழ்வுகள் (Current Affairs)</option>
                    <option value="இந்தியப் புவியியல் (Geography of India)">இந்தியப் புவியியல் (Geography of India)</option>
                    <option value="இந்திய வரலாறு மற்றும் பண்பாடு (History & Culture)">இந்திய வரலாறு மற்றும் பண்பாடு (History & Culture)</option>
                    <option value="இந்திய ஆட்சியியல் (Polity & Constitution)">இந்திய ஆட்சியியல் (Polity & Constitution)</option>
                    <option value="இந்தியப் பொருளாதாரம் (Indian Economy)">இந்தியப் பொருளாதாரம் (Indian Economy)</option>
                    <option value="இந்திய தேசிய இயக்கம் (Indian National Movement)">இந்திய தேசிய இயக்கம் (Indian National Movement)</option>
                    <option value="Unit 8: தமிழ்நாட்டின் வரலாறு, பண்பாடு & சமூக-அரசியல் இயக்கங்கள்">Unit 8: தமிழ்நாட்டின் வரலாறு, பண்பாடு & சமூக-அரசியல் இயக்கங்கள்</option>
                    <option value="Unit 9: தமிழ்நாட்டின் வளர்ச்சி நிர்வாகம் (Development Administration)">Unit 9: தமிழ்நாட்டின் வளர்ச்சி நிர்வாகம் (Development Administration)</option>
                    <option value="திறனறிவும் மனக்கணக்கு நுண்ணறிவும் (Aptitude & Mental Ability)">திறனறிவும் மனக்கணக்கு நுண்ணறிவும் (Aptitude & Mental Ability)</option>
                </optgroup>
            </select>
        </div>

        <div class="input-group">
            <label>குறிப்பிட்ட தலைப்பு (Topic)</label>
            <input type="text" id="topicSelect" placeholder="எ.கா: திருக்குறள் / பஞ்சாயத்து ராஜ் / 10th Science / சிந்துவெளி நாகரிகம்">
        </div>

        <div class="input-group">
            <label>வினாக்களின் எண்ணிக்கை</label>
            <select id="questionCount">
                <option value="10">10 வினாக்கள்</option>
                <option value="20" selected>20 வினாக்கள்</option>
                <option value="35">35 வினாக்கள்</option>
                <option value="40">40 வினாக்கள்</option>
            </select>
        </div>

        <button class="btn-primary" onclick="generateQuestions()"><i class="fa-solid fa-bolt"></i> AI தேர்வை உருவாக்கு</button>
    </div>

    <!-- Loading Screen -->
    <div id="loadingCard" class="loading-spinner" style="display: none;">
        <i class="fa-solid fa-spinner fa-spin fa-3x" style="color: var(--accent);"></i>
        <p style="margin-top: 15px;" id="loadingText">AI வினாக்களை தயாரித்துக் கொண்டிருக்கிறது...</p>
    </div>

    <!-- TAB 2: Quiz Area -->
    <div id="tab-quiz" class="tab-content">
        <div class="quiz-header">
            <span id="lblSubject" style="color: #38bdf8; font-weight: bold;"></span>
            <span id="lblProgress">0 / 0</span>
        </div>

        <div id="quizContainer"></div>

        <button id="btnNext" class="btn-primary" style="display:none; margin-top: 15px;" onclick="nextQuestion()">அடுத்த வினா <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <!-- TAB 3: Results -->
    <div id="tab-result" class="tab-content" style="text-align: center;">
        <h2>தேர்வு முடிவுகள்</h2>
        <div style="font-size: 48px; margin: 20px 0; color: #38bdf8;" id="scoreText">0 / 0</div>
        <p id="scoreMessage" style="color: var(--text-muted); margin-bottom: 20px;"></p>
        <button class="btn-primary" onclick="switchTab('tab-create')">புதிய தேர்வு தொடங்க</button>
    </div>
</div>

<!-- Global Modal -->
<div id="customModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="color: #38bdf8; margin-bottom: 10px;"></h3>
        <p id="modalMessage" style="margin-bottom: 20px; font-size: 14px;"></p>
        <button class="btn-primary" onclick="closeModal()">சரி</button>
    </div>
</div>

<script>
    let questions = [];
    let currentQ = 0;
    let score = 0;

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        if(tabId === 'tab-create') document.getElementById('tab1-btn').classList.add('active');
        if(tabId === 'tab-quiz') document.getElementById('tab2-btn').classList.add('active');
        if(tabId === 'tab-result') document.getElementById('tab3-btn').classList.add('active');
    }

    function showModal(title, msg) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalMessage').innerText = msg;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }

    async function generateQuestions() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        if(!apiKey) { showModal("API Key தேவை", "தயவுசெய்து உங்கள் Gemini API சாவியை உள்ளிடவும்."); return; }

        const exam = document.getElementById('examSelect').value;
        const subject = document.getElementById('subjectSelect').value;
        const topic = document.getElementById('topicSelect').value.trim() || "பொதுவான தலைப்புகள்";
        const count = document.getElementById('questionCount').value;

        document.getElementById('tab-create').style.display = 'none';
        document.getElementById('loadingCard').style.display = 'block';

        const prompt = `TNPSC ${exam} பாடத்திட்டத்தின் அடிப்படையில் - ${subject} (${topic}) பாடத்திலிருந்து ${count} தரமான வினாக்களை உருவாக்கவும். 
        கண்டிப்பாக கீழ்க்கண்ட JSON Array வடிவில் மட்டுமே பதிலளிக்கவும்:
        [
          {
            "q": "வினா உரை",
            "options": ["விடை A", "விடை B", "விடை C", "விடை D"],
            "ans": 0,
            "exp": "இந்த வினாவிற்கான விரிவான விளக்கம்"
          }
        ]`;

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            document.getElementById('loadingCard').style.display = 'none';

            if(response.ok && data.candidates && data.candidates[0].content) {
                let jsonText = data.candidates[0].content.parts[0].text;
                questions = JSON.parse(jsonText);
                currentQ = 0;
                score = 0;
                
                document.getElementById('lblSubject').innerText = subject;
                switchTab('tab-quiz');
                showQuestion();
            } else {
                showModal("API பிழை", data.error ? data.error.message : "தரவைப் பெற முடியவில்லை.");
                document.getElementById('tab-create').style.display = 'block';
            }
        } catch (e) {
            document.getElementById('loadingCard').style.display = 'none';
            showModal("பிழை", "நெட்வொர்க் பிழை அல்லது தவறான API Key: " + e.message);
            document.getElementById('tab-create').style.display = 'block';
        }
    }

    function showQuestion() {
        if(currentQ >= questions.length) {
            showResults();
            return;
        }

        document.getElementById('lblProgress').innerText = `${currentQ + 1} / ${questions.length}`;
        const q = questions[currentQ];

        let html = `
            <div class="q-card">
                <h3>${currentQ + 1}. ${q.q}</h3>
                <div style="margin-top:15px;">
                    ${q.options.map((opt, i) => `
                        <button class="option-btn" id="opt_${i}" onclick="checkAnswer(${i}, ${q.ans})">${opt}</button>
                    `).join('')}
                </div>
                <div id="explanationArea"></div>
            </div>
        `;

        document.getElementById('quizContainer').innerHTML = html;
        document.getElementById('btnNext').style.display = 'none';
    }

    function checkAnswer(selected, correct) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);

        if(selected === correct) {
            document.getElementById(`opt_${selected}`).classList.add('correct');
            score++;
        } else {
            document.getElementById(`opt_${selected}`).classList.add('wrong');
            document.getElementById(`opt_${correct}`).classList.add('correct');
        }

        const expArea = document.getElementById('explanationArea');
        const q = questions[currentQ];

        expArea.innerHTML = `
            <div class="explanation-box">
                <strong>📖 விளக்கம்:</strong><br>${q.exp}
            </div>
            <div class="ai-ask-box">
                <label><i class="fa-solid fa-robot"></i> AI-யிடம் கூடுதல் விளக்கம் கேட்க:</label>
                <textarea id="aiAskInput" placeholder="உதாரணம்: இதைப் பற்றி இன்னும் விரிவாக விளக்கு..."></textarea>
                <button class="btn-primary" style="padding:8px;" onclick="askAIExtra()">கேள்வி கேள்</button>
                <div id="aiReplyBox" style="margin-top:10px; font-size:13px; color:#38bdf8;"></div>
            </div>
        `;

        document.getElementById('btnNext').style.display = 'block';
    }

    async function askAIExtra() {
        const query = document.getElementById('aiAskInput').value.trim();
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const replyBox = document.getElementById('aiReplyBox');

        if(!query) return;
        replyBox.innerText = "AI சிந்திக்கிறது...";

        const currentQuestionText = questions[currentQ].q;
        const prompt = `வினா: "${currentQuestionText}". பயனர் கேள்வி: "${query}". தயவுசெய்து சுருக்கமாகவும் எளிமையாகவும் விளக்கவும்.`;

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await res.json();
            if(res.ok) {
                replyBox.innerText = "💡 AI பதில்: " + data.candidates[0].content.parts[0].text;
            } else {
                replyBox.innerText = "மன்னிக்கவும், பதிலைப் பெற முடியவில்லை.";
            }
        } catch(e) {
            replyBox.innerText = "பிழை ஏற்பட்டது.";
        }
    }

    function nextQuestion() {
        currentQ++;
        showQuestion();
    }

    function showResults() {
        switchTab('tab-result');
        document.getElementById('scoreText').innerText = `${score} / ${questions.length}`;
        
        let msg = "";
        const percentage = (score / questions.length) * 100;
        if(percentage >= 80) msg = "அற்புதமான முயற்சி! நீங்கள் சிறந்த முறையில் தேர்ச்சி பெற்றுள்ளீர்கள்! 🎉";
        else if(percentage >= 50) msg = "நல்ல முயற்சி! இன்னும் கொஞ்சம் பயிற்சி செய்தால் மேலும் அதிக மதிப்பெண் பெறலாம். 👍";
        else msg = "மேலும் தீவிரமாகப் படிக்க வேண்டும். மீண்டும் முயற்சி செய்யுங்கள்! 💪";
        
        document.getElementById('scoreMessage').innerText = msg;
    }
</script>

</body>
</html>
